# Host Nginx site for ReForge. Copy this to /etc/nginx/sites-available/reforge,
# replace the domain if needed, then run Certbot with the Nginx plugin.
server {
    listen 80;
    listen [::]:80;
    server_name sunraku.site www.sunraku.site;

    # Let ACME HTTP-01 certificate validation reach the webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
