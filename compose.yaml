services:
  sandbox-image:
    build:
      context: ./sandbox
    image: reforge-sandbox:latest
    command: ["sh", "-c", "true"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: reforge/backend/Dockerfile
    env_file:
      - .env
    environment:
      REFORGE_CONTAINER_RUNS_ROOT: /app/runs
      # Set REFORGE_DOCKER_HOST_RUNS_ROOT to your absolute host runs path when
      # using Docker Desktop; this lets the sibling sandbox mount each run.
      REFORGE_DOCKER_HOST_RUNS_ROOT: ${REFORGE_DOCKER_HOST_RUNS_ROOT:-}
      # Docker Desktop bind mounts on some Windows hosts deny writes from the
      # image's unprivileged UID. This explicit, logged compatibility fallback
      # keeps root confined to the otherwise hardened sandbox container.
      REFORGE_SANDBOX_ROOT_FALLBACK: "true"
      # Persist Google ADK sessions next to run state so session memory
      # survives backend restarts (override in .env to change or disable).
      ADK_SESSION_DB_URL: ${ADK_SESSION_DB_URL:-sqlite:////app/runs/adk_sessions.db}
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-image:
        condition: service_completed_successfully

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "5173:80"
    depends_on:
      - backend
