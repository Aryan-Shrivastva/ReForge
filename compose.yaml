services:
  sandbox-image:
    build:
      context: ./sandbox
    image: reforge-sandbox:latest
    command: ["sh", "-c", "true"]
    restart: "no"

  backend:
    image: reforge-backend
    build:
      context: .
      dockerfile: reforge/backend/Dockerfile
    env_file:
      - .env
    environment:
      REFORGE_CONTAINER_RUNS_ROOT: /app/runs
      # Sibling sandbox containers need the *host* path of ./runs. The backend
      # detects it from its own mounts; set this only to override detection.
      REFORGE_DOCKER_HOST_RUNS_ROOT: ${REFORGE_DOCKER_HOST_RUNS_ROOT:-}
      # Docker Desktop bind mounts on some Windows hosts deny writes from the
      # image's unprivileged UID. This explicit, logged compatibility fallback
      # keeps root confined to the otherwise hardened sandbox container.
      REFORGE_SANDBOX_ROOT_FALLBACK: "true"
      # Persist Google ADK sessions next to run state so session memory
      # survives backend restarts (override in .env to change or disable).
      ADK_SESSION_DB_URL: ${ADK_SESSION_DB_URL:-sqlite:////app/runs/adk_sessions.db}
      # Planning runs on the ADK planner below, reached agent-to-agent over A2A.
      # Set A2A_PLANNER_URL= (empty) in .env to plan in-process instead.
      A2A_PLANNER_URL: ${A2A_PLANNER_URL-http://a2a-planner:8002}
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-image:
        condition: service_completed_successfully

  # Google ADK's developer web UI, browsing the same ADK session database the
  # backend writes: each run's session, its event timeline, and state deltas.
  # Open http://127.0.0.1:8001/dev-ui/?app=reforge (pick a run's session there).
  adk-web:
    image: reforge-backend
    # Built by the backend service; never pull it from a registry.
    pull_policy: never
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    command:
      - adk
      - web
      - --host=0.0.0.0
      - --port=8001
      - --session_service_uri=${ADK_SESSION_DB_URL:-sqlite:////app/runs/adk_sessions.db}
      - /app/adk_apps
    ports:
      - "8001:8001"
    volumes:
      - ./runs:/app/runs
    depends_on:
      - backend

  # The ADK planning agent served over the A2A protocol (agent card at
  # http://127.0.0.1:8002/.well-known/agent-card.json). The backend's planning
  # role and the CrewAI repair agent's consult_reforge_planner tool call it.
  a2a-planner:
    image: reforge-backend
    pull_policy: never
    env_file:
      - .env
    environment:
      A2A_PUBLIC_URL: http://a2a-planner:8002
    command:
      - uvicorn
      - reforge.backend.app.a2a_planner:app
      - --host=0.0.0.0
      - --port=8002
    ports:
      - "8002:8002"
    depends_on:
      - backend

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "5173:80"
    depends_on:
      - backend
