services:
  sandbox-image:
    build:
      context: ./sandbox
    image: reforge-sandbox:latest
    command: ["sh", "-c", "true"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: reforge/backend/Dockerfile
    env_file:
      - .env
    environment:
      REFORGE_CONTAINER_RUNS_ROOT: /app/runs
      # Set REFORGE_DOCKER_HOST_RUNS_ROOT to your absolute host runs path when
      # using Docker Desktop; this lets the sibling sandbox mount each run.
      REFORGE_DOCKER_HOST_RUNS_ROOT: ${REFORGE_DOCKER_HOST_RUNS_ROOT:-}
      # Docker Desktop bind mounts on Windows deny writes from the image's
      # unprivileged UID. Root is confined to the read-only sandbox container.
      REFORGE_SANDBOX_USER: "0"
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-image:
        condition: service_completed_successfully

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "5173:80"
    depends_on:
      - backend
