[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reforge"
version = "0.1.0"
description = "Multi-agent software modernization and repair system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "crewai[anthropic]>=1.12,<2",
  "docker>=7.0,<8",
  "fastapi>=0.115,<1",
  "packaging>=24,<27",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["reforge/backend/app"]

[tool.pytest.ini_options]
testpaths = ["reforge/backend/tests"]
addopts = "-ra -p no:cacheprovider"
