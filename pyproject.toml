[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reforge"
version = "0.1.0"
description = "Multi-agent software modernization and repair system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # appdirs is imported by ReForge's CrewAI storage redirect; newer CrewAI
  # releases no longer pull it in transitively.
  "appdirs>=1.4,<2",
  "crewai[anthropic,google-genai]>=1.12,<2",
  # MCPServerAdapter: CrewAI agents use ReForge's MCP tool server.
  "crewai-tools[mcp]>=1.0,<2",
  "docker>=7.0,<8",
  "fastapi>=0.115,<1",
  # Google Agent Development Kit: per-run sessions with state for the
  # analysis/planning agents (AGENT_FRAMEWORK=adk or hybrid).
  # The [a2a] extra adds to_a2a, which serves the ADK planner over the A2A protocol.
  "google-adk[a2a]>=1.14,<2",
  # ADK's LiteLlm wrapper lets ADK agents use OpenAI, Anthropic, and Ollama.
  "litellm>=1.75.5,<2",
  # Model Context Protocol: ReForge's tool server (mcp_server.py) and its client.
  "mcp>=1.10,<2",
  # Tracing, exported to LangFuse (or any OTLP collector) over OTLP/HTTP.
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "packaging>=24,<27",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["reforge/backend/app"]

[tool.pytest.ini_options]
testpaths = ["reforge/backend/tests"]
addopts = "-ra -p no:cacheprovider"
